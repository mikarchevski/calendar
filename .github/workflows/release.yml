name: Build and Release

on:
  push:
    tags:
      - 'v*' # Запускается при создании тега, например, v1.1.4

# 🔑 ВАЖНО: Даем токену права на создание релизов и загрузку артефактов
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest # Inno Setup работает только на Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish .NET App
        # Собираем приложение так, как мы делали это локально
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false

      - name: Install Inno Setup
        # Устанавливаем Inno Setup через пакетный менеджер Windows
        run: choco install innosetup -y

      - name: Build Installer
        # Компилируем установщик. Убедитесь, что installer.iss лежит в корне репозитория!
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 🔑 ВАЖНО: Имя файла должно ТОЧНО совпадать с OutputBaseFilename в installer.iss + .exe
          # Если в installer.iss у вас OutputBaseFilename=Calendar_Setup, то пишем Calendar_Setup.exe
          files: InstallerOutput/Calendar_Setup.exe 
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}