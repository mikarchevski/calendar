name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release: # Combined into one job, removed the empty 'release' job
    runs-on: windows-latest
    
    # ✅ FIX 1: Add permissions to resolve the 403 Forbidden error
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Publish
      run: dotnet publish --configuration Release --no-build --output ./publish
      
    - name: Install NSIS
      run: choco install nsis -y
      shell: pwsh

    - name: Build NSIS installer
      run: |
        & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
      shell: pwsh

    # ✅ FIX 2: Verify the installer was actually generated in the root folder
    - name: Debug - Verify Installer Exists
      run: |
        if (Test-Path "Calendar-Setup.exe") { 
          Write-Host "✅ Installer found!" 
        } else { 
          Write-Host "❌ Installer NOT found! Listing directory:"
          Get-ChildItem 
        }
      shell: pwsh

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      shell: bash

    - name: Upload release asset
      uses: softprops/action-gh-release@v2
      with:
        files: Calendar-Setup.exe
        name: Calendar ${{ env.VERSION }}
        body: |
          ## Calendar ${{ env.VERSION }}
          
          Нативный десктопный календарь для Windows.
          
          ### Установка:
          1. Скачай `Calendar-Setup.exe`
          2. Запусти установщик
          3. Следуй инструкциям
          
          ### Требования:
          - Windows 10 (1803+) или Windows 11
          - Microsoft Edge WebView2 Runtime (обычно уже установлен)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
